<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Patch89 short table verification</title><style>body{font:15px system-ui;background:#17232a;color:white}button{padding:12px}iframe{display:block;border:0}pre{white-space:pre-wrap}textarea{width:95%;height:100px}</style></head><body><h1>Patch89 all-seat short table matrix</h1><button id="run">Run short-screen matrix</button><pre id="result">NOT_EXECUTED</pre><textarea id="evidence" readonly aria-label="Full evidence"></textarea><iframe id="frame" title="Isolated actual application"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),evidence=document.querySelector('#evidence');
const views=[[1366,650],[1366,600],[1280,600],[1366,768],[1440,860],[1536,730],[1366,625],[1280,580],[1024,768],[1100,950],[701,900],[768,1024],[1180,830]];
const rect=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
const overlap=(a,b)=>Math.min(a.right,b.right)>Math.max(a.x,b.x)+1&&Math.min(a.bottom,b.bottom)>Math.max(a.y,b.y)+1;
const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function load(w,h,n,phase){frame.style.width=w+'px';frame.style.height=h+'px';await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('fixture timeout')),20000);frame.onload=()=>{const poll=()=>{if(frame.contentDocument.querySelector('.seat')&&frame.contentDocument.querySelector('#table-actions')){clearTimeout(t);resolve()}else setTimeout(poll,25)};poll()};frame.src=`./layout-frame.html?seats=${n}&phase=${phase}`});await tick()}
document.querySelector('#run').onclick=async()=>{const results=[];for(const [w,h] of views)for(let n=2;n<=10;n++)for(const phase of ['preflop','complete']){out.textContent=`RUNNING ${w}x${h}/${n}/${phase} (${results.length}/234)`;try{await load(w,h,n,phase);const d=frame.contentDocument,seats=[...d.querySelectorAll('.perimeter-table .seat')],board=rect(d.querySelector('.board-area')),table=rect(d.querySelector('.perimeter-table')),actions=rect(d.querySelector('#table-actions')),failures=[];if(seats.length!==n)failures.push('seat count');const bounds=seats.map(rect);for(let i=0;i<n;i++){const a=bounds[i];if(a.x<0||a.right>d.documentElement.clientWidth+1||a.y<0||a.bottom>h+1)failures.push(`seat ${i} outside viewport`);if(overlap(a,board))failures.push(`seat ${i} overlaps board`);for(let j=i+1;j<n;j++)if(overlap(a,bounds[j]))failures.push(`seats ${i}/${j} overlap`);if(w<=1180&&overlap(a,actions))failures.push(`seat ${i} covered by action bar`)}for(const id of phase==='complete'?['next-hand']:['fold','call','raise']){const a=rect(d.getElementById(id));if(a.y<0||a.bottom>h+1||a.height<44)failures.push(id+' not accessible')}if(Math.abs(table.height-480)>1)failures.push('not short layout');results.push({w,h,seats:n,phase,status:failures.length?'FAIL':'PASS',failures,table,seatBounds:bounds,actions});}catch(e){results.push({w,h,seats:n,phase,status:'FAIL',error:String(e)})}evidence.value=JSON.stringify({status:'RUNNING',results})}const result={status:results.every(r=>r.status==='PASS')?'PASS':'FAIL',count:results.length,passed:results.filter(r=>r.status==='PASS').length,results};evidence.value=JSON.stringify(result);out.textContent=JSON.stringify({...result,results:results.filter(r=>r.status!=='PASS')},null,2)};
</script></body></html>
