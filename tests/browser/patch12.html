<!doctype html><html><head><title>Patch12 browser tests</title><style>body{background:#17232a;color:white;font:16px system-ui}iframe{width:390px;height:664px;border:0}pre{white-space:pre-wrap}</style></head><body><h1>Patch12 actual application tests</h1><button id="run">Run automatic control checks</button><iframe id="frame" title="Isolated real application"></iframe><pre id="result">NOT_EXECUTED</pre><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result');frame.style.width=(new URLSearchParams(location.search).get('width')||'390')+'px';let resolve;window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.kind==='patch12')resolve?.(e.data)});document.querySelector('#run').onclick=async()=>{const rows=[],keys=['ai-texas-hold-em:auto-deal','ai-texas-hold-em:bot-pace'],prior=keys.map(k=>localStorage.getItem(k));try{for(const mode of ['auto','preaction']){out.textContent=JSON.stringify({status:'RUNNING',mode,rows});rows.push(await new Promise(r=>{resolve=r;frame.src='./patch12-frame.html?mode='+mode+'&run='+Date.now()}))}out.textContent=JSON.stringify({status:rows.every(r=>r.status==='PASS')?'PASS':'FAIL',rows},null,2)}finally{keys.forEach((k,i)=>prior[i]===null?localStorage.removeItem(k):localStorage.setItem(k,prior[i]))}};
</script></body></html>
