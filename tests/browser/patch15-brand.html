<!doctype html><html lang="en"><meta charset="utf-8"><title>Gold Crown Casino brand verification</title><style>body{font:16px system-ui;background:#122329;color:#eee}iframe{border:0;display:block}pre{white-space:pre-wrap}textarea{width:95%;height:80px}</style><h1>Gold Crown Casino — real application brand checks</h1><button id="run">Run nine cases</button><pre id="result">NOT_EXECUTED</pre><textarea id="evidence" readonly aria-label="Evidence"></textarea><iframe id="frame" title="Actual application"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),evidence=document.querySelector('#evidence');let sequence=0;
document.querySelector('#run').onclick=async()=>{const rows=[];try{for(const [width,height]of[[320,568],[395,627],[1366,650]])for(const seats of[2,9,10]){out.textContent=`Running ${width}×${height}, ${seats} seats`;frame.style.width=width+'px';frame.style.height=height+'px';const current=++sequence;const layout=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{removeEventListener('message',receive);reject(Error('Fixture timeout'))},20000);function receive(event){if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.sequence!==current)return;clearTimeout(timer);removeEventListener('message',receive);resolve(event.data.result)}addEventListener('message',receive);frame.src=`./patch1-frame.html?seats=${seats}&phase=preflop&sequence=${current}`});if(layout.status!=='PASS')throw Error(JSON.stringify(layout.failures));const doc=frame.contentDocument;const brand=doc.querySelector('.brand'),watermark=doc.querySelector('.table-watermark'),footer=doc.querySelector('footer');const check=(value,message)=>{if(!value)throw Error(message)};check(brand.getAttribute('aria-label')==='Gold Crown Casino home','Brand accessible name');check(brand.textContent.includes('GOLD CROWN'),'Header brand');check(watermark.textContent==='GOLDCROWN','Watermark');check(footer.textContent.includes('GOLD CROWN CASINO'),'Footer brand');check(doc.documentElement.scrollWidth<=width,'Page overflow');rows.push({width,height,seats,status:'PASS',layout,brand:brand.getAttribute('aria-label'),watermark:watermark.textContent,footer:footer.textContent});evidence.value=JSON.stringify({status:'RUNNING',rows});}const data={status:'PASS',count:rows.length,rows};evidence.value=JSON.stringify(data);out.textContent=JSON.stringify({status:data.status,count:data.count});}catch(error){out.textContent=JSON.stringify({status:'FAIL',error:String(error)});evidence.value=JSON.stringify({status:'FAIL',error:String(error),rows})}};
</script></html>
