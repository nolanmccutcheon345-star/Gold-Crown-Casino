<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Patch89 preflop sizes</title><style>body{font:15px system-ui;background:#17232a;color:white}button{padding:12px}iframe{display:block;border:0}pre{white-space:pre-wrap}</style></head><body><h1>Preflop BB buttons and unchanged postflop controls</h1><button id="run">Run new preset checks</button><pre id="result">NOT_EXECUTED</pre><iframe id="frame" title="Actual isolated poker application"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))),assert=(v,m)=>{if(!v)throw Error(m)};
async function load(w,h,n,phase){frame.style.width=w+'px';frame.style.height=h+'px';await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('fixture timeout')),20000);frame.onload=()=>{const poll=()=>{if(frame.contentDocument.querySelector('#raise-to')){clearTimeout(t);resolve()}else setTimeout(poll,25)};poll()};frame.src=`./layout-frame.html?seats=${n}&phase=${phase}`});await tick()}
document.querySelector('#run').onclick=async()=>{const rows=[];for(const [w,h] of [[320,568],[395,627],[430,800],[1366,650]])for(const n of [2,3,9,10])for(const phase of ['preflop','river']){try{await load(w,h,n,phase);const d=frame.contentDocument,input=d.querySelector('#raise-to'),buttons=[...d.querySelectorAll('.street-size')];assert(buttons.length===(phase==='preflop'?4:0),'street preset count');const before=d.querySelector('.pot-display').textContent+[...d.querySelectorAll('.seat strong')].map(e=>e.textContent).join('|');for(const [bb,total] of [[2.5,5],[3,6],[4,8],[5,10]])if(phase==='preflop'){const b=d.querySelector(`[data-size="bb-${bb}"]`);assert(b.textContent.includes('$'+total),'dollar label');b.click();b.click();assert(Number(input.value)===total,'raise-to proposal');assert(!d.querySelector('#raise').disabled,'legal BB proposal disabled');assert(before===d.querySelector('.pot-display').textContent+[...d.querySelectorAll('.seat strong')].map(e=>e.textContent).join('|'),'proposal committed chips');}
for(const id of ['25','33','half','75','pot','150','200','all'])assert(!!d.querySelector(`[data-size="${id}"]`),'existing preset missing '+id);const all=d.querySelector('[data-size="all"]');all.focus();await tick();const r=all.getBoundingClientRect();assert(d.activeElement===all&&r.left>=0&&r.right<=d.documentElement.clientWidth+1,'All-in not reachable by focus');rows.push({w,h,seats:n,phase,status:'PASS',bbPresets:buttons.length,allInReachable:true,proposalsOnly:true});}catch(e){rows.push({w,h,seats:n,phase,status:'FAIL',error:String(e)})}out.textContent=JSON.stringify({status:'RUNNING',rows})}out.textContent=JSON.stringify({status:rows.every(r=>r.status==='PASS')?'PASS':'FAIL',count:rows.length,rows},null,2)};
</script></body></html>
