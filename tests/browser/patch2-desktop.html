<!doctype html><html><head><meta charset="utf-8"><title>Patch2 desktop qualification</title><style>body{font:14px system-ui;background:#18252a;color:white}button{padding:12px}iframe{display:block;border:0}pre{white-space:pre-wrap}</style></head><body><h1>Patch2 desktop / tablet control visibility</h1><button id="run">Run desktop checks</button><pre id="result">NOT_EXECUTED</pre><iframe id="frame" title="Isolated real application"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result');
const views=[[701,900],[768,1024],[844,390],[1024,768],[1180,800],[1181,800],[1280,720],[1366,800],[1920,1000]];
const rect=e=>{let r=e.getBoundingClientRect();return{x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
const overlap=(a,b)=>Math.min(a.right,b.right)>Math.max(a.x,b.x)+1&&Math.min(a.bottom,b.bottom)>Math.max(a.y,b.y)+1;
async function load(w,h,seats){frame.style.width=w+'px';frame.style.height=h+'px';await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('render timeout')),20000);frame.onload=()=>{const check=()=>{if(frame.contentDocument.querySelector('#fold')){clearTimeout(timeout);resolve();}else setTimeout(check,50)};check()};frame.src='./layout-frame.html?seats='+seats+'&phase=preflop'});await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
document.querySelector('#run').onclick=async()=>{const results=[];try{for(const [w,h] of views)for(const seats of [9,10]){out.textContent=`Running ${w}x${h}/${seats}`;await load(w,h,seats);const d=frame.contentDocument,win=frame.contentWindow,failures=[];const inspect=label=>{for(const id of ['fold','call','raise']){const e=d.getElementById(id);if(!e)continue;const r=rect(e);if(r.x<0||r.right>d.documentElement.clientWidth||r.y<0||r.bottom>h||r.height<44)failures.push(label+' '+id+' offscreen');}};inspect('initial');const save=d.querySelector('.save-status'),room=d.querySelector('.room-details');if(save&&room&&overlap(rect(save),rect(room)))failures.push('session controls overlap table settings');win.scrollTo(0,400);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));inspect('scrolled');results.push({w,h,seats,status:failures.length?'FAIL':'PASS',failures});}out.textContent=JSON.stringify({status:results.every(r=>r.status==='PASS')?'PASS':'FAIL',results},null,2);}catch(e){out.textContent=JSON.stringify({status:'FAIL',error:String(e),results},null,2)}};
</script></body></html>
