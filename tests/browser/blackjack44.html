<!doctype html><html lang="en"><meta charset="utf-8"><title>Version44 paced blackjack qualification</title><style>body{font:16px system-ui;background:#122329;color:#eee}iframe{border:0}pre{white-space:pre-wrap}textarea{width:95%;height:120px}</style><h1>Paced blackjack · live isolated verification</h1><button id="run">Run pace, counts and recovery checks</button><button id="grade">Check mid-reveal count grading</button><pre id="result">NOT_EXECUTED</pre><textarea id="evidence" readonly></textarea><iframe id="frame" title="Paced candidate"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),evidence=document.querySelector('#evidence');
const delay=ms=>new Promise(r=>setTimeout(r,ms)),check=(ok,msg)=>{if(!ok)throw Error(msg)};
const doc=()=>frame.contentDocument,state=()=>{try{return JSON.parse(doc().querySelector('#test-state').textContent)}catch{return {}}};
async function wait(fn){const start=performance.now();while(!fn()){check(performance.now()-start<60000,'Timeout '+fn);await delay(25)}}
const click=s=>{const e=doc().querySelector(s);check(e&&!e.disabled,'Missing enabled '+s);e.click()};
async function command(s){const rev=state().revision;click(s);await wait(()=>!state().busy&&(state().revision>rev||state().status!=='ready'));check(state().status==='ready','Command failed '+state().error)}
async function open(id,w,h){frame.width=w;frame.height=h;await new Promise(r=>{frame.onload=r;frame.src='./blackjack37-frame.html?id='+id});await wait(()=>doc().querySelector('[data-view="blackjack"]'));click('[data-view="blackjack"]');await wait(()=>state().status==='ready'&&!state().busy)}
const tags=r=>'23456'.includes(r)?1:'TJQKA'.includes(r)?-1:0;
function visibleRanks(){const cards=[...doc().querySelectorAll('.bj-felt .bj-card:not(.card-back)')].map(e=>{const x=e.querySelector('b').textContent.trim();return x.startsWith('10')?'T':x[0]});return cards.concat([...doc().querySelectorAll('.bj-seat .bj-mini b')].map(e=>e.textContent==='10'?'T':e.textContent))}
function balance(){return [...doc().querySelectorAll('.bj-strip .strip-cell')].find(e=>e.querySelector('small')?.textContent.startsWith('Balance'))?.querySelector('b').textContent}
let samples=0;
async function watch(previous,baseBalance,skip=false){let maximum=0,frames=0;const start=performance.now();while(doc().querySelector('#bj-skip')){
 check(performance.now()-start<90000,'reveal stalled');const ranks=visibleRanks();check(ranks.length>=maximum,'visible cards removed during reveal');maximum=ranks.length;
 check([...doc().querySelectorAll('[data-blackjack-action]')].every(e=>e.disabled),'action enabled during reveal');check(!doc().querySelector('#bj-hint'),'hint visible early');check(!doc().querySelector('#bj-rebet-deal'),'settled controls visible early');check(balance()===baseBalance,'balance changed before reveal finished');
 const count=doc().querySelector('[data-testid="blackjack-count-strip"] b');if(count&&count.textContent!=='Hidden'){const expected=previous.reduce((n,c)=>n+tags(c[0]),0)+ranks.reduce((n,r)=>n+tags(r),0);check(Number(count.textContent.replace('−','-'))===expected,'visible count mismatch '+count.textContent+' expected '+expected);}
 for(const hand of doc().querySelectorAll('.bj-hand'))if(!hand.querySelector('.bj-card')){check(!hand.querySelector('.bj-total'),'empty hero total');check(hand.getAttribute('aria-label').includes('no cards yet'),'empty hero accessible label');}
 if(!doc().querySelector('.bj-dealer .bj-card'))check(doc().querySelector('.bj-empty')?.textContent==='Dealing…','empty dealer prompt');
 for(const button of doc().querySelectorAll('[data-blackjack-action]')){const css=frame.contentWindow.getComputedStyle(button);check(Number(css.opacity)===.38,'disabled opacity');check(css.filter==='saturate(0.15)','disabled desaturation');}
 frames++;samples++;if(skip&&frames>=3){click('#bj-skip');break}await delay(40);
}return {frames,ms:performance.now()-start,skip}}
async function visibleHero(w){for(const e of doc().querySelectorAll('[data-blackjack-action]:not(:disabled)'))check(Number(frame.contentWindow.getComputedStyle(e).opacity)===1,'enabled action dimmed');if(w>700)return;await wait(()=>[...doc().querySelectorAll('.bj-hand')].every(e=>e.getBoundingClientRect().top>=-1&&e.getBoundingClientRect().bottom<=doc().querySelector('#bj-actions').getBoundingClientRect().top));check(doc().documentElement.scrollWidth<=w+1,'horizontal overflow');for(const e of doc().querySelectorAll('.bj-seat-name'))check(e.scrollWidth<=e.clientWidth+1,'clipped name '+e.textContent)}
document.querySelector('#grade').onclick=async()=>{try{
 await open('b44-grade-'+Date.now(),390,844);click('[data-blackjack-others="6"]');click('[data-blackjack-pace="slow"]');await command('#blackjack-sit');click('#bj-count-on');await command('#bj-deal');await wait(()=>visibleRanks().length>=3&&doc().querySelector('#bj-skip'));
 const ranks=visibleRanks(),expected=ranks.reduce((n,r)=>n+tags(r),0),aces=ranks.filter(r=>r==='A').length;click('#bj-count-reveal');doc().querySelector('#bj-count-answer').value=String(expected);doc().querySelector('#bj-count-aces').value=String(aces);click('#bj-count-check');check(doc().querySelector('.bj-count-result.right'),'visible count answer not graded correctly');click('#bj-skip');out.textContent='PASS mid-reveal visible count and ace grading';evidence.value=JSON.stringify({status:'PASS',test:'mid-reveal count grading',visibleCards:ranks,expected,aces});
}catch(e){out.textContent='FAIL '+e;evidence.value=JSON.stringify({status:'FAIL',error:String(e)})}};
document.querySelector('#run').onclick=async()=>{const rows=[];let rounds=0;try{for(const [w,h] of [[320,568],[390,844],[1366,768]])for(const pace of ['slow','casino','fast']){
 const id='b44-'+Date.now()+'-'+w+'-'+pace;await open(id,w,h);click('[data-blackjack-others="6"]');click('[data-blackjack-seat="4"]');click('[data-blackjack-pace="'+pace+'"]');await command('#blackjack-sit');click('#bj-count-on');const reveals=[];
 for(let r=0;r<2;r++){
 const previous=state().seen,base=balance();await command(r?'#bj-rebet-deal':'#bj-deal');reveals.push(await watch(previous,base,r===1));await visibleHero(w);
 while(state().publicState.round.phase!=='settled'){const b=balance();await command(state().publicState.round.phase==='insurance'?'#bj-insurance-no':'[data-blackjack-action="stand"]');reveals.push(await watch(previous,b,r===1));await visibleHero(w)}rounds++;
 }
 // Reload during a third reveal: persisted final state, no animation replay or extra payout.
 await command('#bj-rebet-deal');await wait(()=>doc().querySelector('#bj-skip'));const saved=state().publicState,bank=state().balance;await open(id,w,h);check(!doc().querySelector('#bj-skip'),'reload unexpectedly repeats reveal');check(JSON.stringify(state().publicState)===JSON.stringify(saved),'reload changed table');check(state().balance===bank,'reload changed balance');
 while(state().publicState.round.phase!=='settled'){const b=balance(),before=state().seen;await command(state().publicState.round.phase==='insurance'?'#bj-insurance-no':'[data-blackjack-action="stand"]');if(doc().querySelector('#bj-skip'))click('#bj-skip');}
 rounds++;await command('#bj-leave');click('#bj-audit');await wait(()=>doc().body.textContent.includes('Full replay audit passed'));rows.push({w,h,pace,reveals,reload:true,audit:true});out.textContent='RUNNING '+rounds+' rounds / '+samples+' reveal observations';evidence.value=JSON.stringify({rows,rounds,samples});
}out.textContent='PASS '+rounds+' rounds, '+rows.length+' pace/viewport configurations, '+samples+' reveal observations';evidence.value=JSON.stringify({status:'PASS',rounds,rows,samples,userAgent:navigator.userAgent,conditions:'Chromium live app in isolated iframe viewports. Timing includes observation and CPU contention; not physical Safari.'});}catch(e){out.textContent='FAIL '+e;evidence.value=JSON.stringify({status:'FAIL',error:String(e),rows,rounds,samples})}};
</script></html>
