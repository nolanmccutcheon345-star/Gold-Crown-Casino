<!doctype html><html lang="en"><meta charset="utf-8"><title>Patch14 home-screen resources</title><style>body{background:#122329;color:#eee;font:18px system-ui}img{width:180px;height:180px}pre{white-space:pre-wrap}</style><h1>Actual home-screen resources</h1><img src="/apple-touch-icon.png" alt="Poker Night AI home-screen icon"><button id="run">Verify resources</button><pre id="result">NOT_EXECUTED</pre><script type="module">
const out=document.querySelector('#result');document.querySelector('#run').onclick=async()=>{try{const rows=[];const check=(v,m)=>{if(!v)throw Error(m);rows.push(m)};const r=await fetch('/site.webmanifest');check(r.ok,'Manifest served successfully');const manifest=await r.json();check(manifest.name==='Poker Night AI'&&manifest.short_name==='Poker Night AI','Expected home-screen label');check(manifest.display==='browser'&&manifest.start_url==='./'&&manifest.scope==='./','Browser display and relative scope retained');for(const [path,size]of[['/apple-touch-icon.png',180],['/icon-192.png',192],['/icon-512.png',512]]){const response=await fetch(path);check(response.ok,path+' served');const image=new Image();image.src=path;await image.decode();check(image.naturalWidth===size&&image.naturalHeight===size,path+' dimensions');}const doc=new DOMParser().parseFromString(await(await fetch('/')).text(),'text/html');check(doc.querySelector('link[rel=manifest]')?.getAttribute('href')==='/site.webmanifest','Manifest linked in actual entry HTML');check(doc.querySelector('link[rel=apple-touch-icon]')?.getAttribute('href')==='/apple-touch-icon.png','Apple icon linked in actual entry HTML');check(doc.querySelector('meta[name=apple-mobile-web-app-title]')?.content==='Poker Night AI','Apple title present');check(!doc.querySelector('meta[name=apple-mobile-web-app-capable]'),'No standalone capability requested');out.textContent=JSON.stringify({status:'PASS',rows,physicalInstallation:'NOT_EXECUTED'},null,2)}catch(e){out.textContent=JSON.stringify({status:'FAIL',error:String(e)})}};
</script></html>
