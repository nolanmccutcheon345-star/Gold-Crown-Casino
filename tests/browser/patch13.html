<!doctype html><html><head><title>Patch13 setup checks</title><style>body{background:#17232a;color:white;font:16px system-ui}iframe{width:395px;height:627px;border:0}pre{white-space:pre-wrap}</style></head><body><h1>Patch13 actual application setup checks</h1><button id="run">Run setup checks</button><iframe id="frame" title="Isolated real setup"></iframe><pre id="result">NOT_EXECUTED</pre><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),params=new URLSearchParams(location.search);frame.style.width=(params.get('width')||'395')+'px';frame.style.height=(params.get('height')||'627')+'px';let resolve;window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.kind==='patch13')resolve?.(e.data)});document.querySelector('#run').onclick=async()=>{const rows=[];for(const count of [2,6,9,10]){out.textContent=JSON.stringify({status:'RUNNING',count,rows});rows.push(await new Promise(r=>{resolve=r;frame.src='./patch13-frame.html?count='+count+'&run='+Date.now()}));if(rows.at(-1).status==='FAIL')break}out.textContent=JSON.stringify({status:rows.length===4&&rows.every(r=>r.status==='PASS')?'PASS':'FAIL',rows},null,2)};
</script></body></html>
