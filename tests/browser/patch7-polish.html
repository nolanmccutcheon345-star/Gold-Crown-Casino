<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Patch7 controls qualification</title><style>body{font:16px system-ui;background:#17232a;color:white}button{padding:12px}iframe{display:block;border:0}pre{white-space:pre-wrap}</style></head><body><h1>Patch7 phone controls</h1><p>Actual application with isolated in-memory fixture; no physical-device or screen-reader claim.</p><button id="run">Run patch7 checks</button><iframe id="frame" title="Isolated phone poker table"></iframe><pre id="result">NOT_EXECUTED</pre><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result');
const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const assert=(v,m)=>{if(!v)throw Error(m)};
async function load(w,h){frame.style.width=w+'px';frame.style.height=h+'px';await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('fixture timeout')),20000);frame.onload=()=>{const poll=()=>{if(frame.contentDocument.querySelector('#raise-to')){clearTimeout(t);resolve()}else setTimeout(poll,30)};poll()};frame.src='./layout-frame.html?seats=9&phase=preflop&patch7='+Date.now()});await tick()}
document.querySelector('#run').onclick=async()=>{const rows=[];for(const [w,h] of [[320,568],[375,667],[390,664],[395,627],[430,800],[844,390],[390,400]]){try{await load(w,h);const d=frame.contentDocument,win=frame.contentWindow,el=s=>d.querySelector(s),click=s=>el(s).click(),input=(s,v)=>{el(s).value=v;el(s).dispatchEvent(new win.Event('input',{bubbles:true}))};
const measure=()=>['#fold','#call','#raise'].map(s=>{const r=el(s).getBoundingClientRect();assert(r.top>=0&&r.bottom<=h&&r.height>=44,s+' inaccessible');return r.top});
const closed=measure();click('#sizing-more>summary');await tick();const open=measure();input('#raise-to','0');await tick();const invalid=measure();assert(closed.every((v,i)=>Math.abs(v-open[i])<1&&Math.abs(v-invalid[i])<1),'Action buttons moved');assert(el('#pot-slider-value').textContent==='—'&&el('#raise').disabled,'Invalid below-call state');
click('[data-size="min"]');const total=Number(el('#raise-to').value);const call=Number(el('.action-top h2').textContent.match(/[\d.]+/)?.[0]);const pot=Number(el('.pot-display strong')?.textContent.replace(/[^\d.]/g,''));const minimumPercent=Math.round((total-call)*100/(pot+call));assert(el('#pot-slider-value').textContent===minimumPercent+'%','Minimum percentage is not inverse of displayed pot and call');
input('#pot-slider','37');assert(el('#pot-slider-value').textContent==='37%','Slider label');click('#pause');await new Promise(r=>setTimeout(r,150));assert(el('#pot-slider-value').textContent==='—','Paused slider should be unavailable');click('#pause');await new Promise(r=>setTimeout(r,150));assert(el('#pot-slider-value').textContent==='37%','Draft percentage lost after save');
input('#raise-to','1000');assert(Number(el('#pot-slider-value').textContent.replace('%',''))>300&&el('#pot-slider').value==='300'&&el('#raise').disabled,'Over-range typed amount');click('[data-size="min"]');
const heading=el('.pot-breakdown-heading'),caption=heading.querySelector('small');if(w<=700)assert(caption.getBoundingClientRect().left<=heading.getBoundingClientRect().left+2,'Caption not left aligned');
const notesHeight=el('.player-notes').getBoundingClientRect().height;if(w<=700)assert(notesHeight===54,'Closed notes row is not 54px');rows.push({width:w,height:h,status:'PASS',closed,open,invalid,minimum:total,minimumPercent,notesHeight,call,pot,sliderRetained:true,overRange:true});}catch(e){rows.push({width:w,height:h,status:'FAIL',error:String(e)})}out.textContent=JSON.stringify({status:'RUNNING',rows},null,2)}out.textContent=JSON.stringify({status:rows.every(r=>r.status==='PASS')?'PASS':'FAIL',rows},null,2)};
</script></body></html>
