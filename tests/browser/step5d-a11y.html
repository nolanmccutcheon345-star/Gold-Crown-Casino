<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Step5D real UI accessibility evidence</title><style>body{font:16px system-ui;background:#101b20;color:#edf3ec;padding:16px}button{font:inherit;padding:12px;min-height:44px}iframe{width:390px;max-width:100%;height:844px;display:block;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>Step5D real UI accessibility checks</h1><p>Production app, controller and engine with an isolated in-memory persistence fixture. No production saves are accessed. Programmatic focus checks are not trusted keyboard or physical screen-reader execution.</p><button id="run-a11y">Run six 2 / 6 / 10-seat cases</button><p id="a11y-status" role="status">NOT_EXECUTED</p><iframe id="a11y-frame" title="Isolated actual poker application"></iframe><pre id="a11y-result"></pre><script type="module">
const frame=document.querySelector('#a11y-frame'),button=document.querySelector('#run-a11y'),status=document.querySelector('#a11y-status'),result=document.querySelector('#a11y-result');let receive;
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.kind==='step5d-a11y')receive?.(event.data.result);});
button.onclick=async()=>{button.disabled=true;const results=[];try{for(const width of [320,1280])for(const seats of [2,6,10]){frame.style.width=width+'px';frame.style.maxWidth='none';status.textContent=`RUNNING: ${width}px, ${seats} seats`;const row=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Accessibility QA case did not finish')),60000);receive=value=>{clearTimeout(timer);receive=null;resolve(value);};frame.src=`./step5d-a11y-frame.html?seats=${seats}&run=${Date.now()}`;});results.push(row);result.textContent=JSON.stringify({status:'RUNNING',results},null,2);}const passed=results.filter(row=>row.status==='PASS').length;status.textContent=passed===6?'PASS':'FAIL';result.textContent=JSON.stringify({status:passed===6?'PASS':'FAIL',passed,total:6,results,screenReader:'NOT_EXECUTED',physicalDevice:'NOT_EXECUTED',trustedKeyboard:'NOT_EXECUTED'},null,2);}catch(error){status.textContent='FAIL';result.textContent=JSON.stringify({status:'FAIL',error:String(error),results},null,2);}finally{button.disabled=false;}};
</script></body></html>
