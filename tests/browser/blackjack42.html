<!doctype html><html lang="en"><meta charset="utf-8"><title>Version42 seated blackjack qualification</title><style>body{font:16px system-ui;background:#122329;color:#eee}iframe{border:0}pre{white-space:pre-wrap}textarea{width:95%;height:140px}</style><h1>Seated blackjack · isolated browser qualification</h1><button id="run">Run seated rounds and recovery</button><pre id="result">NOT_EXECUTED</pre><textarea id="evidence" readonly></textarea><iframe id="frame" title="Candidate at test viewport"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),evidence=document.querySelector('#evidence');
const delay=ms=>new Promise(r=>setTimeout(r,ms)),check=(ok,msg)=>{if(!ok)throw Error(msg)};
const doc=()=>frame.contentDocument;const state=()=>{try{return JSON.parse(doc().querySelector('#test-state').textContent)}catch{return {}}};
async function wait(fn){const start=performance.now();while(!fn()){check(performance.now()-start<20000,'Timeout '+fn);await delay(20)}}
const click=s=>{const e=doc().querySelector(s);check(e&&!e.disabled,'Missing enabled '+s);e.click()};
async function ready(){await wait(()=>state().status==='ready'&&!state().busy)}
async function command(s){const revision=state().revision;click(s);await wait(()=>!state().busy&&(state().revision>revision||state().status!=='ready'));check(state().status==='ready','Command failed '+state().error)}
async function open(id,w,h){frame.width=w;frame.height=h;await new Promise(r=>{frame.onload=r;frame.src='./blackjack37-frame.html?id='+id});await wait(()=>doc().querySelector('[data-view="blackjack"]'));click('[data-view="blackjack"]');await ready()}
function geometry(w,h,label){const d=doc();check(d.documentElement.scrollWidth<=w+1,label+' horizontal overflow');const controls=d.querySelector('#bj-actions').getBoundingClientRect();const hands=[...d.querySelectorAll('.bj-hand')].map(e=>e.getBoundingClientRect());if(w<=700)for(const r of hands){check(r.top>=-1&&r.bottom<=controls.top+1,label+' Hero obscured '+JSON.stringify({top:r.top,bottom:r.bottom,controls:controls.top}));}for(const e of d.querySelectorAll('.bj-minis .bj-mini')){check(e.scrollWidth<=e.clientWidth+1,label+' card text clipped')}return {controlsTop:controls.top,heroBottom:Math.max(0,...hands.map(r=>r.bottom)),stripTop:d.querySelector('.bj-strip').getBoundingClientRect().top}}
async function finish(){let n=0;while(state().publicState.round.phase!=='settled'){check(n++<20,'round stalled');await command(state().publicState.round.phase==='insurance'?'#bj-insurance-no':'[data-blackjack-action="stand"]')}}
document.querySelector('#run').onclick=async()=>{const rows=[];let rounds=0;try{for(const [w,h] of [[320,568],[390,844],[1366,768]])for(const others of [2,4,6])for(const seat of [1,4,7]){
 const id='b42-'+Date.now()+'-'+w+'-'+others+'-'+seat;await open(id,w,h);click('[data-blackjack-group="casino"]');click('[data-blackjack-table="casino-5"]');click('[data-blackjack-others="'+others+'"]');click('[data-blackjack-seat="'+seat+'"]');await command('#blackjack-sit');click('#bj-count-on');
 let shape;
 for(let r=0;r<(others===6?8:2);r++){
  const balance=state().balance;await command(r?'#bj-rebet-deal':'#bj-deal');if(w<=700)await wait(()=>[...doc().querySelectorAll('.bj-hand')].every(e=>e.getBoundingClientRect().top>=-1&&e.getBoundingClientRect().bottom<=doc().querySelector('#bj-actions').getBoundingClientRect().top+1));shape=geometry(w,h,'dealt '+id);
  check(state().publicState.seating.heroSeat===seat,'Hero wrong seat');check(state().publicState.seating.seats.filter(s=>s.kind==='player').length===others,'wrong other seats');
  if(r===0){const saved=state().publicState;await open(id,w,h);check(JSON.stringify(state().publicState)===JSON.stringify(saved),'reload changed public round');}
  await finish();rounds++;const settled=state().publicState.round;check(state().balance===balance+settled.net,'balance disagrees with round');check(settled.net===settled.hands.reduce((n,x)=>n+x.payout-x.bet,0)-50+settled.insuranceReturn-settled.insuranceBet,'other chips entered Hero net');
 }
 await command('#bj-leave');click('#bj-audit');await wait(()=>doc().body.textContent.includes('Full replay audit passed'));rows.push({w,h,others,seat,rounds:others===6?8:2,shape,reload:true,audit:true,financial:true});out.textContent='RUNNING '+rounds+' rounds';evidence.value=JSON.stringify({rows,rounds});
}out.textContent='PASS '+rounds+' rounds, '+rows.length+' seated configurations';evidence.value=JSON.stringify({status:'PASS',rounds,rows,userAgent:navigator.userAgent,conditions:'Actual live application in Chromium iframe viewports, isolated IndexedDB. Not physical Safari/VoiceOver.'});}catch(e){out.textContent='FAIL '+e;evidence.value=JSON.stringify({status:'FAIL',error:String(e),rows,rounds})}};
</script></html>
