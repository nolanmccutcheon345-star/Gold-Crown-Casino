<!doctype html><html lang="en"><meta charset="utf-8"><title>Version37 live blackjack browser qualification</title><style>body{font:16px system-ui;background:#122329;color:#eee}iframe{border:0}pre{white-space:pre-wrap}textarea{width:95%;height:160px}</style><h1>Playable blackjack qualification</h1><button id="run">Run live tables, reload and two-tab checks</button><pre id="result">NOT_EXECUTED</pre><textarea id="evidence" readonly></textarea><iframe id="frame" title="Isolated candidate"></iframe><iframe id="second" title="Second isolated tab" hidden></iframe><script type="module">
import {BLACKJACK_TABLES} from '../../src/blackjack/presets.ts';
const frame=document.querySelector('#frame'),second=document.querySelector('#second'),out=document.querySelector('#result'),evidence=document.querySelector('#evidence');
const delay=ms=>new Promise(r=>setTimeout(r,ms)); const check=(ok,msg)=>{if(!ok)throw Error(msg)};
async function wait(fn){const start=performance.now();while(!fn()){check(performance.now()-start<20000,'Timeout '+fn);await delay(20)}}
const doc=(f=frame)=>f.contentDocument;
const state=(f=frame)=>{try{return JSON.parse(doc(f).querySelector('#test-state').textContent)}catch{return{}}};
const click=(s,f=frame)=>{const e=doc(f).querySelector(s);check(e&&!e.disabled&&!e.closest('fieldset[disabled]'),'Missing/enabled '+s);e.click()};
async function ready(f=frame){await wait(()=>state(f).status==='ready'&&!state(f).busy);}
async function command(s,f=frame){const before=state(f).revision;click(s,f);await wait(()=>!state(f).busy&&state(f).revision>before);check(state(f).status==='ready','Command failed '+s+':'+state(f).error);}
async function open(id,w,h,f=frame){f.width=w;f.height=h;await new Promise(r=>{f.onload=r;f.src='./blackjack37-frame.html?id='+id});await wait(()=>doc(f).querySelector('[data-view="blackjack"]'));click('[data-view="blackjack"]',f);await ready(f)}
function layout(label){const d=doc();check(d.documentElement.scrollWidth<=Number(frame.width)+1,label+' horizontal overflow');for(const e of d.querySelectorAll('button,input,select')){const r=e.getBoundingClientRect();if(r.width&&r.height){check(e.getAttribute('aria-label')||e.textContent.trim()||e.labels?.length,label+' unnamed control '+e.id)}}const panel=d.querySelector('#bj-actions');if(panel){const r=panel.getBoundingClientRect();check(r.height<=Number(frame.height)-50,label+' controls too tall')}}
async function finish(){let n=0;while(state().publicState?.round?.phase!=='settled'){check(n++<20,'round stalled');await command(state().publicState.round.phase==='insurance'?'#bj-insurance-no':'[data-blackjack-action="stand"]')}return state().publicState.round;}
document.querySelector('#run').onclick=async()=>{const rows=[],timings=[];let hands=0;try{for(const [w,h] of [[320,568],[390,844],[1366,768]]){
const id='b37-'+Date.now()+'-'+w;await open(id,w,h);check(state().balance===200000,'independent $2000 genesis');
for(const table of BLACKJACK_TABLES.filter(t=>t.variant==='classic')){
click('[data-blackjack-group="'+table.group+'"]');click('[data-blackjack-table="'+table.id+'"]');await command('#blackjack-sit');layout(table.id+' betting');
for(let round=0;round<2;round++){
 const before=state().balance,fee=table.group==='home'?0:50,start=performance.now();await command(round?'#bj-rebet-deal':'#bj-deal');
 if(table.id==='casino-5'&&round===0){const saved=state();await open(id,w,h);check(JSON.stringify(state().publicState)===JSON.stringify(saved.publicState),'active-round reload changedcards/revision');rows.push({w,h,test:'active-round reload exact',pass:true});const resume=new Promise(r=>{frame.onload=r});frame.contentWindow.dispatchEvent(new PageTransitionEvent('pageshow',{persisted:true}));await resume;await wait(()=>doc().querySelector('[data-view="blackjack"]'));click('[data-view="blackjack"]');await ready();check(JSON.stringify(state().publicState)===JSON.stringify(saved.publicState),'BFCache recovery changed committed round');rows.push({w,h,test:'cached-page lifecycle reload + exact recovery (synthetic event)',pass:true})}
 const settled=await finish();hands++;timings.push(performance.now()-start);check(state().balance===before+settled.net,'round financial agreement');check(settled.net===settled.hands.reduce((n,x)=>n+x.payout-x.bet,0)-fee+settled.insuranceReturn-settled.insuranceBet,'independent public payout + fee');layout(table.id+' result');
}
await command('#bj-leave');rows.push({w,h,test:table.id+' two rounds, leave, financial agreement',pass:true});}
click('[data-blackjack-group="casino"]');click('[data-blackjack-table="casino-5-free-bet"]');check(doc().querySelector('#blackjack-sit').disabled,'FreeBet must remain unavailable');
click('#bj-history-export');await wait(()=>doc().querySelector('a[download="blackjack-public-history.json"]'));const url=doc().querySelector('a[download="blackjack-public-history.json"]').href;const exported=await(await fetch(url)).json();check(!JSON.stringify(exported).includes('initialShoe'),'private shoe exported');click('#bj-audit');await wait(()=>doc().body.textContent.includes('Full replay audit passed'));rows.push({w,h,test:'public export and full audit',pass:true});
// Real concurrent IDB snapshots, one stale action must not overwrite the first.
click('[data-blackjack-group="home"]');await command('#blackjack-sit');await open(id,w,h,second);await ready(second);const draft=doc(second).querySelector('#bj-bet-amount');draft.value='1';draft.dispatchEvent(new Event('input',{bubbles:true}));await command('#bj-deal');const firstRevision=state().revision,firstBalance=state().balance;click('#bj-deal',second);await wait(()=>state(second).status==='readonly'||state(second).status==='error');check(state().revision===firstRevision&&state().balance===firstBalance,'stale tab changed first snapshot');await open(id,w,h,second);check(state(second).revision===firstRevision&&state(second).balance===firstBalance,'stale tab mutated committed state');rows.push({w,h,test:'concurrent stale-tab rejection + committed reload',pass:true});
await finish();await command('#bj-leave');out.textContent='RUNNING '+hands+' rounds';evidence.value=JSON.stringify({rows,hands,timings});
}
const sorted=[...timings].sort((a,b)=>a-b);out.textContent='PASS '+rows.length+' checks, '+hands+' completed measured rounds';evidence.value=JSON.stringify({status:'PASS',rows,hands,roundWorkflowMs:{p50:sorted[Math.floor(sorted.length*.5)],p95:sorted[Math.floor(sorted.length*.95)],max:Math.max(...sorted)},timings,userAgent:navigator.userAgent,conditions:'Desktop Chromium embedded viewports; round workflows include DOM polling and intentional reloads, not bot preparation or physical-phone measurements.'});}catch(error){out.textContent='FAIL '+error;evidence.value=JSON.stringify({status:'FAIL',error:String(error),rows,hands,timings})}};
</script></html>
