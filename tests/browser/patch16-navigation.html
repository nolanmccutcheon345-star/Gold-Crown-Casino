<!doctype html><html lang="en"><meta charset="utf-8"><title>Patch 16 navigation verification</title><style>body{font:16px system-ui;background:#122329;color:#eee}iframe{border:0;display:block}pre{white-space:pre-wrap}textarea{width:95%;height:80px}</style><h1>Navigation and tournament preview checks</h1><button id="run">Run navigation cases</button><pre id="result">NOT_EXECUTED</pre><textarea id="evidence" readonly aria-label="Evidence"></textarea><iframe id="frame" title="Actual application"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),evidence=document.querySelector('#evidence');let sequence=0;
const pause=()=>new Promise(resolve=>setTimeout(resolve,30));
document.querySelector('#run').onclick=async()=>{const rows=[];try{for(const [width,height,seats]of[[320,568,10],[390,844,9],[1024,768,6],[1440,900,2]]){out.textContent=`Running ${width}×${height}`;frame.style.width=width+'px';frame.style.height=height+'px';const current=++sequence;const layout=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{removeEventListener('message',receive);reject(Error('Fixture timeout'))},30000);function receive(event){if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.sequence!==current)return;clearTimeout(timer);removeEventListener('message',receive);resolve(event.data.result)}addEventListener('message',receive);frame.src=`./patch1-frame.html?seats=${seats}&phase=preflop&sequence=${current}`});if(layout.status!=='PASS')throw Error(JSON.stringify(layout));const doc=frame.contentDocument;const check=(value,message)=>{if(!value)throw Error(message)};const click=async(selector)=>{const el=doc.querySelector(selector);check(el&&el.getBoundingClientRect().height>0&&!el.disabled,`Unavailable ${selector}`);el.click();await pause()};const scene=()=>doc.querySelector('.table-scene').getBoundingClientRect().top;const beforeScene=scene(),beforeTable=doc.querySelector('.table-scene').textContent;await click('#nav-games');check(scene()===beforeScene,'Disclosure moves cash table');check(doc.querySelector('#nav-games').getAttribute('aria-expanded')==='true','Disclosure state');doc.querySelector('#nav-games').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await pause();check(doc.querySelector('#nav-games').getAttribute('aria-expanded')==='false','Escape did not close');check(doc.activeElement.id==='nav-games','Escape focus');await click('#nav-games');await click('[data-view="tournaments"]');let presets=0;for(const tier of ['home','casino','series']){await click(`[data-tournament-tier="${tier}"]`);const ids=[...doc.querySelectorAll('[data-tournament-event]')].map(el=>el.dataset.tournamentEvent);for(const id of ids){await click(`[data-tournament-event="${id}"]`);check(doc.querySelector('#tournament-register').disabled,'Registration enabled');check(doc.body.textContent.includes('Preview only'),'Preview disclaimer missing');check(doc.documentElement.scrollWidth<=width,'Tournament horizontal overflow');presets++;} }check(presets===15,'Preset count');for(const field of [...doc.querySelectorAll('[data-tournament-field]')].map(el=>el.dataset.tournamentField))await click(`[data-tournament-field="${field}"]`);for(const pace of [...doc.querySelectorAll('[data-tournament-pace]')].map(el=>el.dataset.tournamentPace))await click(`[data-tournament-pace="${pace}"]`);await click('[data-view="live"]');check(doc.querySelector('.table-scene').textContent===beforeTable,'Preview browsing changed cash table');await click('[data-view="results"]');await click('[data-view="opponents"]');await click('[data-view="study"]');await click('[data-view="cashier"]');await click('[data-view="live"]');await click('#nav-games');await click('[data-view="host"]');check(doc.documentElement.scrollWidth<=width,'Setup horizontal overflow');await click('[data-view="live"]');rows.push({width,height,seats,presets,layout,status:'PASS',cashTableUnchanged:true,escapeFocus:true,registrationDisabled:true});evidence.value=JSON.stringify({status:'RUNNING',rows});}out.textContent=JSON.stringify({status:'PASS',count:rows.length});evidence.value=JSON.stringify({status:'PASS',rows});}catch(error){out.textContent=JSON.stringify({status:'FAIL',error:String(error)});evidence.value=JSON.stringify({status:'FAIL',error:String(error),rows})}};
</script></html>
