<!doctype html><html lang="en"><meta charset="utf-8"><title>Tournament browser qualification</title><style>body{background:#122329;color:#eee;font:16px system-ui}iframe{border:0}pre{white-space:pre-wrap}textarea{width:95%;height:160px}</style><h1>Tournament UI and recovery qualification</h1><button id="run">Run full event (6 players; ?seats=9 for nine)</button><button id="layout">Run 6/9-seat viewport checks</button><pre id="result">NOT_EXECUTED</pre><textarea id="evidence" readonly></textarea><iframe id="frame" title="Isolated game" width="1366" height="900"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),evidence=document.querySelector('#evidence');const pause=ms=>new Promise(r=>setTimeout(r,ms));const check=(ok,msg)=>{if(!ok)throw Error(msg)};
async function wait(fn,ms=30000){const start=performance.now();while(!fn()){check(performance.now()-start<ms,'Timeout '+fn);await pause(50)}}
async function open(id,width=1366,height=900,seats=6){frame.width=width;frame.height=height;await new Promise(resolve=>{frame.onload=resolve;frame.src='./tournament34-frame.html?id='+id});await wait(()=>frame.contentDocument?.querySelector('[data-view="tournaments"]'));frame.contentDocument.querySelector('[data-view="tournaments"]').click();await wait(()=>frame.contentDocument.querySelector('#tournament-register:not(:disabled)'));if(seats===9){frame.contentDocument.querySelector('[data-tournament-field="9"]').click();await pause(100)}frame.contentDocument.querySelector('#tournament-register').click();await wait(()=>frame.contentDocument.querySelector('#t-actions'));}
function read(){const d=frame.contentDocument;return {hand:d.querySelector('.tournament-table .table-heading span')?.textContent,announcement:d.querySelector('#table-announcement')?.textContent,balance:d.querySelector('.tournament-wallet strong')?.textContent,result:d.querySelector('[data-testid="tournament-result"]')?.textContent,history:d.querySelector('#t-history summary')?.textContent};}
document.querySelector('#run').onclick=async()=>{const rows=[],id='full-'+Date.now(),start=performance.now();try{await open(id,1366,900,Number(new URLSearchParams(location.search).get('seats'))||6);let reloaded=false,actions=0,last='';while(!frame.contentDocument.querySelector('#t-finish')){check(performance.now()-start<900000,'15-minute run limit');let d=frame.contentDocument,state=read();if(state.announcement!==last){last=state.announcement;rows.push(state);evidence.value=JSON.stringify({status:'RUNNING',actions,rows});out.textContent=last;}if(!reloaded&&actions>=2){d.querySelector('#t-pause')?.click();await wait(()=>frame.contentDocument.querySelector('#t-pause')?.textContent==='Resume');const before=read();await new Promise(resolve=>{frame.onload=resolve;frame.contentWindow.location.reload()});await wait(()=>frame.contentDocument.querySelector('[data-view="tournaments"]'));frame.contentDocument.querySelector('[data-view="tournaments"]').click();await wait(()=>frame.contentDocument.querySelector('#t-pause'));const after=read();check(before.hand===after.hand&&before.balance===after.balance,'Reload changes hand or wallet');check(frame.contentDocument.querySelector('#t-pause').textContent==='Resume','Pause lost across reload');frame.contentDocument.querySelector('#t-pause').click();reloaded=true;rows.push({reload:'PASS',before,after});}
 d=frame.contentDocument;const next=d.querySelector('#t-next:not(:disabled)'),allin=d.querySelector('#t-all-in:not(:disabled)'),call=d.querySelector('#t-call:not(:disabled)');if(next)next.click();else if(allin){allin.click();actions++;}else if(call){call.click();actions++;}await pause(100);}
 const final=read(),d=frame.contentDocument;d.querySelector('#t-finish').click();await wait(()=>frame.contentDocument.querySelector('#tournament-register'));const balance=frame.contentDocument.querySelector('.tournament-wallet strong').textContent;check(balance===final.balance,'Finish credits prize twice');const result={status:'PASS',actions,reloaded,elapsedMs:performance.now()-start,final,rows};out.textContent=JSON.stringify({...result,rows:undefined});evidence.value=JSON.stringify(result);}catch(error){out.textContent=JSON.stringify({status:'FAIL',error:String(error)});evidence.value=JSON.stringify({status:'FAIL',error:String(error),rows})}};
document.querySelector('#layout').onclick=async()=>{const rows=[];try{for(const seats of[6,9])for(const[width,height]of[[320,568],[390,844],[430,932],[844,390],[1366,650]]){await open('layout-'+Date.now(),width,height,seats);const d=frame.contentDocument;await wait(()=>d.querySelector('#t-pause:not(:disabled)'));d.querySelector('#t-pause').click();await pause(200);const boxes=[...d.querySelectorAll('[data-t-seat]')].map(el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,right:r.right,bottom:r.bottom}});const overlap=(a,b)=>Math.min(a.right,b.right)-Math.max(a.x,b.x)>.5&&Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y)>.5;check(boxes.length===seats,'Seat count');check(d.documentElement.scrollWidth<=width,'Horizontal overflow');for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++)check(!overlap(boxes[i],boxes[j]),'Overlapping seats '+i+'/'+j);const buttons=[...d.querySelectorAll('#t-fold,#t-call,#t-raise')].map(el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,right:r.right,bottom:r.bottom,height:r.height}});for(const b of buttons){check(b.height>=44,'Small action');check(b.x>=0&&b.right<=width,'Clipped action');if(width<=1180)check(b.y>=0&&b.bottom<=height,'Action outside viewport')}rows.push({seats,width,height,status:'PASS',boxes,buttons});out.textContent=JSON.stringify({status:'RUNNING',completed:rows.length});evidence.value=JSON.stringify({rows});}out.textContent=JSON.stringify({status:'PASS',count:rows.length});evidence.value=JSON.stringify({status:'PASS',rows});}catch(error){out.textContent=JSON.stringify({status:'FAIL',error:String(error)});evidence.value=JSON.stringify({status:'FAIL',error:String(error),rows})}};
</script></html>
