<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated manual player notes</title><style>body{font:15px system-ui;background:#101b20;color:#edf3ec;padding:16px}button{font:inherit;padding:12px;min-height:44px}iframe{width:390px;max-width:100%;height:850px;display:block;margin-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>Manual player notes · actual UI check</h1><p>Isolated in-memory persistence with one deliberate failed write. No production storage is opened.</p><button id="run-notes">Run notes persistence and pending-bot checks</button><p id="status">NOT_EXECUTED</p><pre id="result"></pre><iframe id="notes-table" title="Isolated player notes table"></iframe><script type="module">const frame=document.querySelector('#notes-table'),button=document.querySelector('#run-notes'),status=document.querySelector('#status'),result=document.querySelector('#result');let receive;window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.kind==='step5b-notes-result')receive?.(event.data.result);});button.onclick=async()=>{button.disabled=true;const results=[];try{for(const seats of [2,6,10]){frame.style.width=(seats===10?320:390)+'px';status.textContent='RUNNING · '+seats+' seats';const row=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Notes case timed out')),120000);receive=value=>{clearTimeout(timer);receive=null;resolve(value);};frame.src='./step5b-notes-frame.html?seats='+seats+'&fresh='+Date.now();});results.push(row);result.textContent=JSON.stringify({status:'RUNNING',results},null,2);}const passed=results.filter(row=>row.status==='PASS').length;status.textContent=passed===3?'PASS':'FAIL';result.textContent=JSON.stringify({status:passed===3?'PASS':'FAIL',passed,total:3,results,screenReader:'NOT_EXECUTED'},null,2);}catch(error){status.textContent='FAIL';result.textContent=JSON.stringify({status:'FAIL',error:String(error),results},null,2);}finally{button.disabled=false;}};</script></body></html>
