<!doctype html><html lang="en"><title>Long showdown label regression</title><button id="run">Check long showdown labels</button><pre id="result">NOT_EXECUTED</pre><iframe id="frame" title="Synthetic long-label fixture"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result');document.querySelector('#run').onclick=async()=>{const rows=[];for(const[w,h]of[[701,900],[768,1024],[1024,768],[1280,580],[1366,650],[1348,926],[1920,1000]])for(const n of[2,9,10]){frame.style.cssText=`width:${w}px;height:${h}px;border:0`;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('fixture timeout')),20000);frame.onload=()=>{const poll=()=>{if(frame.contentDocument.querySelector('.seat-hand-label')){clearTimeout(timer);resolve()}else setTimeout(poll,25)};poll()};frame.src=`./layout-frame.html?seats=${n}&phase=complete`});const d=frame.contentDocument;for(const el of d.querySelectorAll('.seat-hand-label'))el.textContent='Full house, queens over sevens';await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const labels=[...d.querySelectorAll('.seat-hand-label')].map(el=>{const st=el.closest('.seat-status'),seat=el.closest('.seat'),a=el.getBoundingClientRect(),b=seat.getBoundingClientRect();return{font:frame.contentWindow.getComputedStyle(el).fontSize,scroll:st.scrollHeight,client:st.clientHeight,contained:a.bottom<=b.bottom+1&&a.top>=b.top-1}});rows.push({w,h,n,labels,status:labels.every(x=>x.font==='12px'&&x.scroll<=x.client+1&&x.contained)?'PASS':'FAIL'});out.textContent=JSON.stringify({status:'RUNNING',rows})}out.textContent=JSON.stringify({status:rows.every(r=>r.status==='PASS')?'PASS':'FAIL',scope:'Synthetic longest label substituted into completed-hand display; not an actual full-house outcome.',rows})};
</script></html>
