<!doctype html><html lang="en"><meta charset="utf-8"><title>Version37 blackjack browser qualification</title><style>body{font:16px system-ui;background:#122329;color:#eee}iframe{border:0}pre{white-space:pre-wrap}textarea{width:95%;height:160px}</style><h1>Blackjack preview and practice qualification</h1><button id="run">Run three viewport workflows and sample screens</button><pre id="result">NOT_EXECUTED</pre><textarea id="evidence" readonly></textarea><iframe id="frame" title="Isolated candidate"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),evidence=document.querySelector('#evidence');
const delay=ms=>new Promise(r=>setTimeout(r,ms)); const check=(ok,msg)=>{if(!ok)throw Error(msg)};
async function wait(fn){const start=performance.now();while(!fn()){check(performance.now()-start<15000,'Timeout '+fn);await delay(25)}}
async function open(url,w,h){frame.width=w;frame.height=h;await new Promise(r=>{frame.onload=r;frame.src=url});await delay(100)}
const d=()=>frame.contentDocument;const click=s=>{const e=d().querySelector(s);check(e&&!e.disabled,'Missing/enabled '+s);e.click()};
const select=(s,v)=>{const e=d().querySelector(s);e.value=v;e.dispatchEvent(new Event('change',{bubbles:true}))};
function layout(label){check(d().documentElement.scrollWidth<=Number(frame.width)+1,label+' horizontal document overflow');for(const e of d().querySelectorAll('button,input,select')){const r=e.getBoundingClientRect();if(r.width&&r.height&&getComputedStyle(e).visibility!=='hidden'){check(e.getAttribute('aria-label')||e.textContent.trim()||e.labels?.length,label+' unnamed control '+e.id)}}}
document.querySelector('#run').onclick=async()=>{const rows=[],timings=[];try{for(const [w,h] of [[320,568],[390,844],[1366,768]]){
 await open('./blackjack37-frame.html?id=bj37-practice-'+Date.now(),w,h);await wait(()=>d().querySelector('[data-view="blackjack"]'));click('[data-view="blackjack"]');await wait(()=>d().querySelector('#blackjack-sit'));
 await wait(()=>!d().querySelector('#blackjack-sit').disabled);check(!d().querySelector('#blackjack-sit').disabled,'classic blackjack available');check(d().querySelector('[data-blackjack-ante="50"]').getAttribute('aria-pressed')==='true','50-cent default');layout('lobby');
 click('[data-blackjack-group="home"]');check(!d().querySelector('[data-blackjack-ante]'),'home fee absent');click('[data-blackjack-group="casino"]');check(d().querySelector('[data-blackjack-ante="50"]').getAttribute('aria-pressed')==='true','casino default after home');click('[data-blackjack-ante="0"]');check(d().body.textContent.includes('No-ante night'),'no ante selection');
 for(const group of ['home','casino','high']){click('[data-blackjack-group="'+group+'"]');for(const id of [...d().querySelectorAll('[data-blackjack-table]')].map(e=>e.dataset.blackjackTable)){click('[data-blackjack-table="'+id+'"]');layout(id)}} rows.push({w,h,test:'nine table catalogue, fee selection and classic availability',pass:true});
 let start=performance.now();click('[data-blackjack-tab="strategy"]');timings.push({w,task:'cold strategy render',ms:performance.now()-start});check(d().body.textContent.includes('approximate strategy advice'),'strategy caveat');click('[data-coach-play]');check(d().querySelector('.bj-drill-score').textContent.includes('of 1 model matches'),'strategy answer');click('#coach-next');select('#coach-table','high-100');layout('strategy');rows.push({w,h,test:'strategy drill, next, rule selection, model labels',pass:true});
 click('[data-blackjack-tab="trainer"]');for(const system of ['hi-lo','wong-halves','zen','hi-opt-2','omega-2']){select('#trainer-system',system);click('#trainer-deal');check(d().querySelector('.bj-tag'),'learn tags');layout(system)}click('[data-trainer-mode="test"]');click('#trainer-deal');check(!d().querySelector('.bj-tag'),'hidden test count');const input=d().querySelector('#trainer-answer');input.value='0';input.dispatchEvent(new Event('input',{bubbles:true}));click('#trainer-check');check(d().querySelector('[role="status"]'),'count feedback');rows.push({w,h,test:'five count systems, learn/test and grading',pass:true});
 start=performance.now();click('[data-blackjack-tab="deviations"]');timings.push({w,task:'cold deviations render',ms:performance.now()-start});check(d().body.textContent.includes('not verified casino-play indices'),'deviation caveat');click('[data-deviation-play]');click('#deviation-next');layout('deviations');rows.push({w,h,test:'experimental count-play drill and next',pass:true});
 click('[data-view="tournaments"]');await wait(()=>d().querySelector('#tournament-register'));check(d().body.textContent.includes('$2,000'),'separate tournament balance');click('[data-view="host"]');check(d().querySelector('#setup-submit'),'cash configuration preserved');rows.push({w,h,test:'cash and tournament navigation intact',pass:true});
 for(const state of ['betting','player','insurance','split','dealer','win','lose','freeBet','highLimit']){await open('./blackjack-preview.html?state='+state+'&coach=1',w,h);layout('sample '+state);check(d().body.textContent.includes('SAMPLE DATA'),'sample label');rows.push({w,h,test:'sample '+state,pass:true})}
 out.textContent='RUNNING '+rows.length;evidence.value=JSON.stringify({rows,timings});
 }out.textContent='PASS '+rows.length+' checks';evidence.value=JSON.stringify({status:'PASS',rows,timings,userAgent:navigator.userAgent});}catch(e){out.textContent='FAIL '+e;evidence.value=JSON.stringify({status:'FAIL',error:String(e),rows,timings})}};
</script></html>
