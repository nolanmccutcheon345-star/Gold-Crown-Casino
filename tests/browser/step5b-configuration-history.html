<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historical population configuration verification</title><style>body{font:15px system-ui;background:#101b20;color:#edf3ec;padding:16px}button{font:inherit;min-height:44px;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{display:block;height:850px;max-width:100%;margin-top:20px}</style></head><body><h1>Immutable configuration history · actual UI</h1><p>Loads a supplied legacy QA save into isolated memory. Runs a new session with a safe next-hand population/stakes/rake change. Production saves are never opened.</p><button id="run-configuration-history">Run legacy and changed-session checks at 320 / 390px</button><p id="status">NOT_EXECUTED</p><pre id="result"></pre><iframe id="configuration-table" title="Isolated historical configuration results"></iframe><script type="module">const frame=document.querySelector('#configuration-table'),button=document.querySelector('#run-configuration-history'),status=document.querySelector('#status'),out=document.querySelector('#result');let receive;window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.kind==='step5b-configuration-result')receive?.(event.data.result);});button.onclick=async()=>{button.disabled=true;const results=[];try{for(const width of [320,390]){frame.width=String(width);status.textContent='RUNNING · '+width+'px';const row=await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('Configuration-history browser case timeout')),120000);receive=value=>{clearTimeout(timeout);receive=null;resolve(value);};frame.src='./step5b-configuration-history-frame.html?width='+width+'&fresh='+Date.now();});results.push(row);out.textContent=JSON.stringify({status:'RUNNING',results},null,2);}const passed=results.filter(row=>row.status==='PASS').length;status.textContent=passed===2?'PASS':'FAIL';out.textContent=JSON.stringify({status:passed===2?'PASS':'FAIL',passed,total:2,results},null,2);}catch(error){status.textContent='FAIL';out.textContent=JSON.stringify({status:'FAIL',error:String(error),results},null,2);}finally{button.disabled=false;}};</script></body></html>
