<!doctype html><html><meta charset="utf-8"><title>Tournament35 interaction checks</title><style>body{background:#122329;color:white;font:16px system-ui}iframe{border:0}textarea{width:95%;height:140px}</style><h1>Tournament35 controls at 320 × 568</h1><button id="run">Run controls and auto-deal checks</button><pre id="result">NOT_EXECUTED</pre><textarea id="evidence" readonly></textarea><iframe id="frame" width="320" height="568" title="Small phone game"></iframe><script type="module">
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),ev=document.querySelector('#evidence');const sleep=ms=>new Promise(r=>setTimeout(r,ms)),check=(x,m)=>{if(!x)throw Error(m)};async function wait(fn,ms=60000){let start=performance.now();while(!fn()){check(performance.now()-start<ms,'Timeout '+fn);await sleep(30)}}const doc=()=>frame.contentDocument;
document.querySelector('#run').onclick=async()=>{const checks=[];try{await new Promise(r=>{frame.onload=r;frame.src='./tournament34-frame.html?id=controls35-'+Date.now()});await wait(()=>doc()?.querySelector('[data-view="tournaments"]'));doc().querySelector('[data-view="tournaments"]').click();await wait(()=>doc().querySelector('#tournament-register:not(:disabled)'));doc().querySelector('#tournament-register').click();await wait(()=>doc().querySelector('#t-raise-to:not(:disabled)'));const field=()=>doc().querySelector('#t-raise-to');const rev=doc().querySelector('#table-announcement').textContent;const old=Number(field().value);doc().querySelector('#t-more').click();check(Number(field().value)>old,'Plus did not increase');doc().querySelector('#t-less').click();check(Number(field().value)===old,'Minus did not restore');const shortcut=doc().querySelector('[data-t-to]');check(shortcut,'No preflop preset');const amount=shortcut.dataset.tTo;shortcut.click();check(field().value===amount,'Preset did not fill');check(doc().querySelector('#table-announcement').textContent===rev,'Sizing submitted action');checks.push('BB/raise shortcut and steppers propose amounts only');
const cards=doc().querySelector('.t-hero-cards').getBoundingClientRect(),panel=doc().querySelector('#t-actions').getBoundingClientRect();check(cards.height>0&&cards.top>=0&&cards.bottom<=568,'Pinned Hero cards outside small screen');check(panel.bottom<=568.5,'Pinned panel clipped');check(doc().documentElement.scrollWidth<=320,'Horizontal overflow');checks.push('Hero cards and controls visible at 320x568');
let moves=0;while(!doc().querySelector('#t-next')){check(!doc().querySelector('#t-fast-forward'),'Hero busted before auto-deal scenario');const call=doc().querySelector('#t-call:not(:disabled)');if(call){call.click();moves++;}check(moves<60,'Hand did not settle');await sleep(100);}await wait(()=>doc().querySelector('#t-auto-deal'));doc().querySelector('#t-auto-deal').click();await wait(()=>doc().querySelector('#t-auto-hold'));doc().querySelector('#t-auto-hold').click();const held=doc().querySelector('.tournament-table .table-heading span').textContent;await sleep(3400);check(doc().querySelector('.tournament-table .table-heading span').textContent===held,'Hold dealt anyway');checks.push('Hold prevents automatic deal after deadline');doc().querySelector('#t-auto-deal').click();doc().querySelector('#t-auto-deal').click();await wait(()=>doc().querySelector('.tournament-table .table-heading span').textContent!==held,8000);checks.push('Opt-in countdown deals next real hand');out.textContent=JSON.stringify({status:'PASS',checks:checks.length});ev.value=JSON.stringify({status:'PASS',checks,cards:{top:cards.top,bottom:cards.bottom},panel:{top:panel.top,bottom:panel.bottom}});}catch(e){out.textContent=JSON.stringify({status:'FAIL',error:String(e)});ev.value=JSON.stringify({status:'FAIL',checks,error:String(e)})}};
</script></html>
